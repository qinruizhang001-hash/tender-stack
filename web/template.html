<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三仓库数据流组合验证报告</title>
<style>
  :root{
    --bg:#f6f7f9;
    --panel:#ffffff;
    --panel-soft:#fbfcfd;
    --border:#e3e6ea;
    --border-strong:#d0d5db;
    --text:#151a21;
    --text-2:#5b6673;
    --text-3:#8a94a0;
    --accent:#1f5fd8;
    --accent-soft:#eaf0fd;
    --ok:#0f7a52;
    --ok-soft:#e7f5ee;
    --warn:#9a6206;
    --warn-soft:#fdf3e2;
    --bad:#b4232a;
    --bad-soft:#fdeceb;
    --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:15px;line-height:1.72;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- top bar ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .top-inner{
    max-width:1280px;margin:0 auto;padding:12px 26px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:12px;min-width:0}
  .brand h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
  .brand .sub{font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .tabs{display:flex;gap:4px;margin-left:auto;background:#eef0f3;padding:3px;border-radius:9px}
  .tabs button{
    font:inherit;font-size:13.5px;padding:6px 16px;border:0;border-radius:7px;
    background:transparent;color:var(--text-2);cursor:pointer;transition:.16s;
  }
  .tabs button[aria-selected="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.10)}
  .badge{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    padding:4px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap;
  }
  .badge.ok{color:var(--ok);background:var(--ok-soft);border-color:#cbe8d9}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ---------- layout ---------- */
  main{max-width:1280px;margin:0 auto;padding:30px 26px 90px}
  .view[hidden]{display:none}

  .report-grid{display:grid;grid-template-columns:216px minmax(0,1fr);gap:44px;align-items:start}
  nav.toc{position:sticky;top:78px;font-size:13px;border-left:2px solid var(--border);padding-left:0}
  nav.toc a{
    display:block;padding:4px 0 4px 12px;margin-left:-2px;color:var(--text-2);
    border-left:2px solid transparent;line-height:1.45;
  }
  nav.toc a:hover{color:var(--accent);text-decoration:none}
  nav.toc a.active{color:var(--accent);border-left-color:var(--accent);font-weight:600;background:linear-gradient(90deg,var(--accent-soft),transparent)}
  nav.toc a.lv3{padding-left:24px;font-size:12.5px;color:var(--text-3)}

  article.report{min-width:0;max-width:none}
  article.report h1{
    font-size:29px;line-height:1.3;margin:0 0 18px;font-weight:680;letter-spacing:-.02em;
  }
  article.report h1::after{
    content:"";display:block;width:52px;height:3px;border-radius:2px;
    background:var(--accent);margin-top:14px;
  }
  article.report h2{
    font-size:21px;margin:52px 0 16px;font-weight:660;letter-spacing:-.01em;
    padding-bottom:10px;border-bottom:1px solid var(--border);scroll-margin-top:76px;
  }
  article.report h3{font-size:16.5px;margin:32px 0 10px;font-weight:650;scroll-margin-top:76px}
  article.report h4{font-size:15px;margin:24px 0 8px;font-weight:650}
  article.report p{margin:12px 0;color:#252c36}
  article.report strong{font-weight:650;color:var(--text)}
  article.report hr{border:0;border-top:1px solid var(--border);margin:38px 0}
  article.report ul,article.report ol{margin:12px 0;padding-left:22px}
  article.report li{margin:6px 0}
  article.report li::marker{color:var(--text-3)}

  article.report code{
    font-family:var(--mono);font-size:12.6px;background:#eef1f5;color:#1b2430;
    padding:1.5px 5px;border-radius:4px;border:1px solid #e2e7ed;
  }
  article.report pre{
    background:#fbfcfd;border:1px solid var(--border);border-radius:10px;
    padding:16px 18px;overflow:auto;margin:16px 0;line-height:1.6;
  }
  article.report pre code{
    background:none;border:0;padding:0;font-size:12.4px;color:#2b3440;
  }
  article.report blockquote{
    margin:20px 0;padding:14px 18px;background:var(--accent-soft);
    border-left:3px solid var(--accent);border-radius:0 8px 8px 0;color:#1b3a70;
  }
  article.report blockquote p{margin:0;color:inherit}

  .table-wrap{overflow-x:auto;margin:18px 0;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
  article.report table{border-collapse:collapse;width:100%;font-size:13.4px;min-width:520px}
  article.report thead th{
    background:var(--panel-soft);text-align:left;font-weight:640;color:var(--text-2);
    padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12.8px;
  }
  article.report tbody td{
    padding:10px 14px;border-bottom:1px solid #eef0f3;vertical-align:top;line-height:1.6;
  }
  article.report tbody tr:last-child td{border-bottom:0}
  article.report tbody tr:hover{background:#fafbfd}
  article.report td:first-child{white-space:nowrap}
  article.report table code{font-size:11.8px}
  article.report th[data-col="真实模型 C"],
  article.report td[data-col="真实模型 C"],
  article.report th[data-col="真实模型（DeepSeek-flash）"],
  article.report td[data-col="真实模型（DeepSeek-flash）"],
  article.report th[data-col="真实模型"],
  article.report td[data-col="真实模型"]{
    background:#f2f6fe;box-shadow:inset 1px 0 0 #dbe6fb,inset -1px 0 0 #dbe6fb;
  }
  article.report th[data-col="真实模型 C"]{color:var(--accent);font-weight:700}
  article.report th[data-col="真实模型（DeepSeek-flash）"]{color:var(--accent);font-weight:700}

  /* ---------- ledger ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
  .stat .k{font-size:12px;color:var(--text-3);letter-spacing:.02em}
  .stat .v{font-size:23px;font-weight:660;margin-top:2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .m{font-size:11.8px;color:var(--text-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .gate-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-8px 0 20px;font-size:12.4px}
  .gs-label{color:var(--text-3);letter-spacing:.02em}
  .gs-item{
    display:inline-flex;gap:6px;align-items:baseline;max-width:100%;
    padding:3px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);
    border:1px solid #f0dcbc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .gs-item b{font-weight:650;font-family:var(--mono);font-size:11.6px}

  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:12px 14px;
    position:sticky;top:61px;z-index:20;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .toolbar input[type=search]{
    font:inherit;font-size:13.5px;padding:8px 12px;border:1px solid var(--border-strong);
    border-radius:8px;min-width:240px;flex:1;max-width:380px;background:#fff;color:var(--text);
  }
  .toolbar input[type=search]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    font:inherit;font-size:12.6px;padding:5px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--border-strong);background:#fff;color:var(--text-2);transition:.14s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .count{margin-left:auto;font-size:12.8px;color:var(--text-3);font-variant-numeric:tabular-nums}

  .ledger{margin-top:14px;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--panel)}
  table.led{width:100%;border-collapse:collapse;font-size:13.2px;table-layout:fixed}
  table.led thead th{
    background:var(--panel-soft);position:sticky;top:0;text-align:left;font-weight:640;
    font-size:12.4px;color:var(--text-2);padding:10px 12px;border-bottom:1px solid var(--border);
    white-space:nowrap;z-index:5;
  }
  table.led td{padding:9px 12px;border-bottom:1px solid #eef0f3;vertical-align:top;line-height:1.55}
  table.led tbody tr{cursor:pointer}
  table.led tbody tr:hover{background:#f7f9fc}
  table.led tbody tr.open{background:var(--accent-soft)}
  .c-id{width:74px;font-family:var(--mono);font-size:12px;color:var(--text-2)}
  .c-type{width:66px}
  .c-str{width:124px}
  .c-sec{width:118px;color:var(--text-3);font-size:12.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-req{width:auto}
  .c-line{width:56px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text-3)}
  .req-text{color:#1d242e}
  .quote{
    margin-top:4px;font-size:12.2px;color:var(--text-3);
    border-left:2px solid #e1e5ea;padding-left:8px;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .pill{
    display:inline-block;font-size:11.5px;padding:1.5px 7px;border-radius:5px;
    background:#eef1f5;color:var(--text-2);white-space:nowrap;
  }
  .pill.must{background:#fdeceb;color:var(--bad)}
  .pill.should{background:#fdf3e2;color:var(--warn)}
  .pill.may{background:#eef1f5;color:var(--text-2)}
  .pill.t{background:var(--accent-soft);color:var(--accent)}
  .pill.t1{background:#e9efff;color:#1f4fc4}
  .pill.t2{background:#e5f6f2;color:#0d7a63}
  .pill.t3{background:#f0ecfd;color:#5b3fbe}
  .pill.t4{background:#eef1f5;color:#4a5563}
  .pill.t5{background:#fdf1e0;color:#9a6206}
  .pill.t6{background:#f2f4f7;color:#66707c}
  .detail td{background:#fbfcfd;padding:0;border-bottom:1px solid var(--border)}
  .detail-inner{padding:14px 16px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 26px}
  .kv{font-size:12.6px;line-height:1.5}
  .kv .k{color:var(--text-3);font-size:11.6px;letter-spacing:.02em;display:block}
  .kv .v{color:var(--text);word-break:break-word}
  .kv .v.mono{font-family:var(--mono);font-size:11.6px}
  .empty{padding:52px;text-align:center;color:var(--text-3);font-size:13.5px}

  footer{
    max-width:1280px;margin:0 auto;padding:0 26px 46px;font-size:12.4px;color:var(--text-3);
  }
  @media (max-width:900px){
    .report-grid{grid-template-columns:1fr}
    nav.toc{display:none}
    main{padding:22px 16px 70px}
    .top-inner{padding:10px 16px}
    .brand .sub{display:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>三仓库数据流组合验证</h1>
      <span class="sub">rag-tender × ai-bid-document × tender-review-kit</span>
    </div>
    <span class="badge ok"><span class="dot"></span>方案 A / B 均成立</span>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="report">验证报告</button>
      <button role="tab" aria-selected="false" data-view="ledger">台账 <span style="opacity:.6">__COUNT__</span></button>
    </div>
  </div>
</header>

<main>
  <section class="view" id="view-report">
    <div class="report-grid">
      <nav class="toc" id="toc"></nav>
      <article class="report">
__REPORT_BODY__
      </article>
    </div>
  </section>

  <section class="view" id="view-ledger" hidden>
    <div class="stats" id="stats"></div>
    <div class="gate-strip" id="gateStrip"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索要求 / 引文 / 编号 / 章节…" autocomplete="off">
      <div class="chips" id="typeChips"></div>
      <div class="chips" id="strChips"></div>
      <span class="count" id="count"></span>
    </div>
    <div class="ledger">
      <table class="led">
        <colgroup>
          <col class="c-id"><col class="c-type"><col class="c-str"><col class="c-sec">
          <col class="c-req"><col class="c-line">
        </colgroup>
        <thead>
          <tr><th>编号</th><th>类型</th><th>强制</th><th>章节</th><th>要求 / 原文引证</th><th style="text-align:right">行</th></tr>
        </thead>
        <tbody id="ledBody"></tbody>
      </table>
      <div class="empty" id="empty" hidden>没有匹配的条目</div>
    </div>
  </section>
</main>

<footer>
  数据源：<code>out/armC_real/gated/requirements.csv</code>（真实标书 83 页 · DeepSeek-flash · 474 条）·
  门禁：0 BLOCKER / 463 WARN / 11 OK · 15 列校验 474/474 PASS
</footer>

<script>
const ROWS = __LEDGER_JSON__;
const GATES = __GATE_JSON__;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- tabs ---------- */
const tabs = [...document.querySelectorAll('.tabs button')];
const views = {report: document.getElementById('view-report'), ledger: document.getElementById('view-ledger')};
tabs.forEach(btn => btn.addEventListener('click', () => {
  tabs.forEach(b => b.setAttribute('aria-selected', String(b === btn)));
  const key = btn.dataset.view;
  Object.entries(views).forEach(([name, node]) => { node.hidden = name !== key; });
  window.scrollTo({top: 0, behavior: 'instant'});
}));
if (location.hash === '#ledger') tabs[1].click();

/* ---------- toc ---------- */
const toc = document.getElementById('toc');
const headings = [...document.querySelectorAll('article.report h2, article.report h3')];
headings.forEach(h => {
  const a = document.createElement('a');
  a.href = '#' + h.id;
  a.textContent = h.textContent;
  if (h.tagName === 'H3') a.classList.add('lv3');
  toc.appendChild(a);
});
const links = [...toc.querySelectorAll('a')];
const spy = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + entry.target.id));
  });
}, {rootMargin: '-70px 0px -75% 0px'});
headings.forEach(h => spy.observe(h));

/* ---------- stats ---------- */
const typeOrder = ['商务','技术','资格','格式','评分','其他'];
const by = (key) => ROWS.reduce((acc, r) => (acc[r[key]] = (acc[r[key]] || 0) + 1, acc), {});
const typeCount = by('type');
const strCount = by('strength');
const mandatory = ROWS.filter(r => r.mandatory === 'Y').length;
const noLine = ROWS.filter(r => r.line_no === '-1').length;
const dup = ROWS.filter(r => r.dup_of).length;
const gateWarn = GATES.reduce((sum, g) => sum + (g.warns || 0), 0);

document.getElementById('stats').innerHTML = [
  ['台账条目', ROWS.length, '15 列全映射'],
  ['硬性要求', mandatory, 'mandatory = Y'],
  ['门禁 BLOCKER', GATES.reduce((s, g) => s + (g.blockers || 0), 0), 'G0–G3 全部通过'],
  ['需复核', ROWS.filter(r => r.status === '需复核').length, '其中 65 条有具体缺陷'],
  ['行号未定位', noLine, (100 * noLine / ROWS.length).toFixed(1) + '% 表格/图注提炼'],
  ['重复已合并', dup, '归一化 + 相似度 ≥0.90'],
].map(([k, v, m]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="m">${m}</div></div>`).join('');

const failedRules = GATES.flatMap(g => (g.rules || []).map((r, i) => [r, (g.details || [])[i]]));
if (failedRules.length) {
  document.getElementById('gateStrip').innerHTML =
    '<span class="gs-label">门禁告警项</span>' +
    failedRules.map(([rule, detail]) =>
      `<span class="gs-item" title="${esc(detail || '')}"><b>${esc(rule)}</b>${esc(detail || '')}</span>`
    ).join('');
}

/* ---------- filters ---------- */
const state = {q: '', type: '', str: ''};

function chips(container, values, key) {
  const all = document.createElement('button');
  all.className = 'chip'; all.textContent = '全部'; all.setAttribute('aria-pressed', 'true');
  all.addEventListener('click', () => { state[key] = ''; paint(); });
  container.appendChild(all);
  values.forEach(value => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = value + ' ' + (key === 'type' ? typeCount[value] : strCount[value]);
    btn.addEventListener('click', () => { state[key] = state[key] === value ? '' : value; paint(); });
    container.appendChild(btn);
  });
}
chips(document.getElementById('typeChips'), typeOrder.filter(t => typeCount[t]), 'type');
chips(document.getElementById('strChips'), ['必须','应','宜','可','禁止'].filter(s => strCount[s]), 'str');

document.getElementById('q').addEventListener('input', event => {
  state.q = event.target.value.trim().toLowerCase();
  paint();
});

/* ---------- render ---------- */
const body = document.getElementById('ledBody');
const empty = document.getElementById('empty');
const countEl = document.getElementById('count');
const strClass = {必须: 'must', 应: 'should', 禁止: 'must', 宜: 'may', 可: 'may'};
const typeClass = {商务: 't1', 技术: 't2', 资格: 't3', 格式: 't4', 评分: 't5', 其他: 't6'};

function matches(row) {
  if (state.type && row.type !== state.type) return false;
  if (state.str && row.strength !== state.str) return false;
  if (!state.q) return true;
  const hay = [row.req_id, row.section, row.requirement, row.source_quote, row.owner, row.response_type]
    .join(' ').toLowerCase();
  return hay.includes(state.q);
}

function detail(row) {
  const fields = [
    ['req_id', row.req_id, true], ['section', row.section], ['type', row.type],
    ['mandatory', row.mandatory], ['strength', row.strength], ['line_no', row.line_no, true],
    ['response_type', row.response_type], ['need_clarify', row.need_clarify],
    ['dup_of', row.dup_of || '—'], ['owner', row.owner], ['status', row.status],
    ['source_ver', row.source_ver], ['note', row.note, true],
  ];
  return `<tr class="detail"><td colspan="6"><div class="detail-inner">` +
    fields.map(([k, v, mono]) => `<div class="kv"><span class="k">${k}</span><span class="v${mono ? ' mono' : ''}">${esc(v)}</span></div>`).join('') +
    `</div></td></tr>`;
}

function paint() {
  document.querySelectorAll('.chips .chip').forEach(btn => {
    const text = btn.textContent.replace(/\s+\d+$/, '');
    const key = document.getElementById('typeChips').contains(btn) ? 'type' : 'str';
    btn.setAttribute('aria-pressed', String(text === '全部' ? !state[key] : state[key] === text));
  });

  const visible = ROWS.filter(matches);
  countEl.textContent = `显示 ${visible.length} / ${ROWS.length} 条`;
  empty.hidden = visible.length > 0;

  const html = [];
  let last = null;
  for (const row of visible) {
    if (last && last.req_id === row.req_id) continue;
    last = row;
    html.push(
      `<tr data-id="${row.req_id}">` +
      `<td class="c-id">${row.req_id}</td>` +
      `<td class="c-type"><span class="pill ${typeClass[row.type] || 't'}">${esc(row.type)}</span></td>` +
      `<td class="c-str"><span class="pill ${strClass[row.strength] || ''}">${esc(row.strength)}</span>` +
        `<span class="pill" style="margin-left:4px">${row.mandatory === 'Y' ? '强制' : '非强制'}</span></td>` +
      `<td class="c-sec" title="${esc(row.section)}">${esc(row.section)}</td>` +
      `<td class="c-req"><div class="req-text">${esc(row.requirement)}</div>` +
        `<div class="quote">${esc(row.source_quote)}</div></td>` +
      `<td class="c-line">${row.line_no}</td>` +
      `</tr>`
    );
  }
  body.innerHTML = html.join('');
}

body.addEventListener('click', event => {
  const tr = event.target.closest('tr[data-id]');
  if (!tr) return;
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('detail')) {
    next.remove(); tr.classList.remove('open'); return;
  }
  const row = ROWS.find(r => r.req_id === tr.dataset.id);
  tr.insertAdjacentHTML('afterend', detail(row));
  tr.classList.add('open');
});

paint();
</script>
