name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          # 测试只 import 判定层，但 match_bid 会连带 import 切块与规则模块
          pip install pytest pdfplumber pymupdf numpy opencv-python-headless

      - name: 语法检查
        run: python -m compileall -q adapter tests workbench/server.py

      - name: 单元测试
        run: python -m pytest tests -q

      - name: 数值比对自测
        run: python adapter/numeric_check.py
